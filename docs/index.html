<!DOCTYPE html>
<html lang="de" data-stil="klassisch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Analysis – Live-Demo</title>
<meta name="description" content="Live-Demo des QGIS-Plugins Urban Analysis: Schritt für Schritt durchklicken, im Stil Klassisch oder Pixel.">
<style>
  /* Farben wie im Plugin (urban_analysis/theme.py) */
  :root, [data-stil="klassisch"] {
    --accent: #2f6fb0; --accent-dark: #1b4672; --accent-light: #e6f0fa;
    --dock-bg: #f6f7f9; --text: #1f2328; --muted: #5b6470;
  }
  [data-stil="pixel"] {
    --accent: #E8655A; --accent-dark: #B8463D; --accent-light: #F9DDD9;
    --dock-bg: #D3E6DF; --text: #1E3B38; --muted: #4F6B66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #e9ebee; color: #1f2328; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Kopf- und Fußzeile mit fester Höhe, damit das Plugin-Bild genau passt */
  :root { --head: 48px; --foot: 68px; --dockhead: 26px; }
  .titlebar { height: var(--head); display: flex; align-items: center; gap: 12px; padding: 0 18px; background: #2b2d31; color: #e8e9eb; }
  .titlebar h1 { flex: 1; font-size: 1rem; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebar h1 span { font-weight: 400; color: #9aa0a8; }
  .stilinfo { font-size: .82rem; color: #b9bec5; white-space: nowrap; }

  /* PC: links Kartenfenster/Anleitung, rechts das Plugin – so groß wie die Höhe erlaubt */
  .workspace { height: calc(100vh - var(--head) - var(--foot)); height: calc(100dvh - var(--head) - var(--foot));
               display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .dock { display: flex; flex-direction: column; background: var(--dock-bg); border-left: 1px solid #c4c4c4; min-height: 0; }
  .dockhead { height: var(--dockhead); font-size: .75rem; color: #555; background: #e3e3e3; border-bottom: 1px solid #c4c4c4; padding: 4px 10px; }
  .frame { position: relative; container-type: inline-size; height: calc(100% - var(--dockhead)); aspect-ratio: 820 / 1100; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Paletten-Symbol im Bild: wechselt den Stil wie im Plugin */
  .palette { position: absolute; left: 85.6%; top: .2%; width: 4.4%; height: 3%; border: 2px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; padding: 0; }
  .palette:hover, .palette:focus-visible { border-color: var(--accent); background: rgba(255,255,255,.3); }

  /* Ecke unten rechts: überdeckt die macOS-Vorschau in manchen Screenshots und zeigt den echten Knopf */
  .patch { position: absolute; left: 72%; right: 0; top: 94.2%; bottom: 0; background: var(--dock-bg); }
  .patch.small { left: 82%; top: 96.2%; }
  .pbtn { position: absolute; right: 2.4%; top: 95.1%; height: 3.3%; padding: 0 2.6cqw; white-space: nowrap; cursor: pointer;
          background: #2f6fb0; color: #fff; border: 1px solid #1b4672; border-radius: .9cqw; font: 700 2.55cqw/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  [data-stil="pixel"] .pbtn { top: 95.15%; height: 2.85%; background: #E8655A; border: 0; border-radius: 0; color: #fff;
          font: 400 1.6cqw/1 "JetBrains Mono", Menlo, Consolas, "Courier New", monospace; box-shadow: 0 .5cqw 0 #B8463D; }
  .pbtn[disabled] { background: #e4e6ea; color: #9aa0a8; border: 1px solid #c9ced6; cursor: default; box-shadow: none; }
  .pbtn.hot { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px var(--accent-light), 0 0 3px 3px var(--accent); }
                    50% { box-shadow: 0 0 0 3px var(--accent-light), 0 0 14px 7px var(--accent); } }

  /* linke Fläche: Karte mit Hinweis oder Anleitung mit Schemazeichnung */
  .canvas { position: relative; min-width: 0; overflow: hidden; background: #fff; }
  .canvas > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .tag { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.94); border: 1px solid #c4c4c4; border-radius: 5px; padding: 3px 9px; font-size: .8rem; color: #333; }
  .note { position: absolute; left: 12px; bottom: 12px; max-width: min(460px, calc(100% - 24px)); background: rgba(255,255,255,.96);
          border: 1px solid #c4c4c4; border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px 12px; font-size: .9rem; }
  .note b, .guide h3 small { display: block; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .maptabs { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .maptabs button { border: 1px solid #c4c4c4; background: rgba(255,255,255,.94); border-radius: 5px; padding: 3px 9px; font-size: .8rem; cursor: pointer; }
  .maptabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-dark); color: #fff; }

  .guide { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px;
           background: #f3f4f6 radial-gradient(#d9dde3 1px, transparent 1px) 0 0 / 22px 22px; }
  .guide .card { width: min(620px, 100%); background: #fff; border: 1px solid #d5d9df; border-radius: 10px; padding: 22px 26px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  .guide h3 { margin: 0 0 6px; font-size: 1.2rem; color: var(--accent-dark); }
  .guide p { margin: 0 0 14px; }
  .guide svg { width: 100%; height: auto; display: block; }
  .guide svg text { font: 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #444; }

  /* Startbild */
  .intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
           background: #f3f4f6 radial-gradient(#d9dde3 1px, transparent 1px) 0 0 / 22px 22px; }
  .intro > div { max-width: 560px; }
  .intro h2 { font-size: 1.9rem; margin: 0 0 8px; }
  .intro p { margin: 0 0 10px; }
  .choice { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .choice button { width: 220px; border: 2px solid #c4c4c4; border-radius: 10px; background: #fff; padding: 16px 12px; cursor: pointer; color: #333; }
  .choice button:hover { border-color: #2f6fb0; }
  .choice b { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  .choice span { display: block; font-size: .85rem; color: #666; }
  .choice .k b { color: #1b4672; } .choice .p b { color: #B8463D; font-family: Menlo, Consolas, monospace; }
  .intro small { display: block; color: #777; margin-top: 18px; line-height: 1.5; }
  .intro a { color: #1b4672; }

  /* Fußzeile: Erklärung + Blättern (je Funktion ein Knopf) */
  .status { height: var(--foot); display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #fff; border-top: 1px solid #c4c4c4; }
  .status .step { font-weight: 700; white-space: nowrap; color: var(--accent-dark); }
  .status p { margin: 0; flex: 1; min-width: 0; font-size: .95rem; }
  .status p small { color: #888; white-space: nowrap; }
  .status nav { display: flex; gap: 8px; flex: none; }
  .status nav button, .status nav a { border: 1px solid #b9b9b9; background: #fafafa; border-radius: 6px; padding: 7px 14px; cursor: pointer; color: #333; text-decoration: none; white-space: nowrap; }
  .status nav .go { background: var(--accent); border-color: var(--accent-dark); color: #fff; font-weight: 600; }
  .status nav .go.glow { animation: glow 1.8s ease-in-out infinite; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .pbtn.hot, .status nav .go.glow { animation: none; box-shadow: 0 0 0 3px var(--accent); } }

  /* Handy: Plugin oben (passt auf den Bildschirm), Erklärung darunter, Blättern unten fest */
  @media (max-width: 900px) {
    :root { --foot: auto; }
    .titlebar { padding: 0 12px; } .titlebar h1 span, .stilinfo { display: none; }
    .workspace { height: auto; display: flex; flex-direction: column; }
    .dock { order: 1; border-left: 0; align-items: center; padding: 10px 0; }
    .dockhead { display: none; }
    .frame { height: auto; width: min(calc(100vw - 24px), calc((100dvh - var(--head) - 150px) * 820 / 1100)); }
    .canvas { order: 2; height: auto; min-height: 340px; border-top: 1px solid #c4c4c4; }
    .guide { position: relative; inset: auto; padding: 14px; } .guide .card { padding: 14px 16px; }
    .intro { position: relative; inset: auto; min-height: 420px; }
    .status { position: sticky; bottom: 0; height: auto; flex-wrap: wrap; gap: 6px 10px; padding: 10px 12px; }
    .status p { flex-basis: 100%; order: 3; font-size: .88rem; }
    .status nav { margin-left: auto; }
  }
</style>
</head>
<body>
<div class="titlebar">
  <h1>Urban Analysis <span>· Live-Demo des QGIS-Plugins</span></h1>
  <span class="stilinfo" id="stilinfo"></span>
</div>

<div class="workspace">
  <section class="canvas" id="canvas" aria-label="Kartenfenster"></section>
  <aside class="dock" aria-label="Plugin Urban Analysis">
    <div class="dockhead">Urban Analysis</div>
    <div class="frame" id="shot"></div>
  </aside>
</div>

<div class="status">
  <span class="step" id="stepno"></span>
  <p id="caption"></p>
  <nav aria-label="Blättern">
    <button type="button" id="prev">‹ Zurück</button>
    <button type="button" class="go glow" id="next">Weiter ›</button>
    <button type="button" id="restart" hidden>Neu starten</button>
    <a class="go" id="download" hidden href="https://github.com/Jade-HS-Vibecoding-WPK/urban-analysis-plugin/releases/latest/download/urban_analysis_plugin.zip">Plugin herunterladen</a>
  </nav>
</div>

    $("caption").textContent = "Eine Demo in Screenshots aus QGIS – Donnerschwee, Oldenburg.";
  }

  function renderCanvas(p) {
    if (p.guide) {
      canvas.innerHTML = '<div class="guide"><div class="card"><h3><small>Im Kartenfenster</small>' + p.guide[0] + "</h3><p>" + p.guide[1] + "</p>" + SVG[p.guide[2]] + "</div></div>";
      return;
    }
    var c = p.map, html;
    if (c.tabs) {
      var t = c.tabs[Math.min(tab, c.tabs.length - 1)];
      html = '<img src="' + img(t[1]) + '" alt="' + t[0] + '"><span class="tag">' + c.label + '</span><div class="maptabs" role="group" aria-label="Ansicht im Kartenfenster">';
      c.tabs.forEach(function (x, i) { html += '<button type="button" data-tab="' + i + '" aria-pressed="' + (x === t) + '">' + x[0] + "</button>"; });
      html += "</div>";
    } else {
      html = '<img src="' + img(c.bild) + '" alt="' + c.label + '"><span class="tag">' + c.label + "</span>";
    }
    canvas.innerHTML = html + (p.note ? '<div class="note"><b>Im Kartenfenster</b>' + p.note + "</div>" : "");
    canvas.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { tab = +b.getAttribute("data-tab"); renderCanvas(p); });
    });
  }

  function render() {
    if (page < 0) { renderIntro(); updateButtons(); return; }
    var p = pages[page], other = stil === "pixel" ? "klassisch" : "pixel";
    var last = page === pages.length - 1;
    renderCanvas(p);
    var html = '<img src="' + img(p.shot, stil) + '" alt="Plugin, Schritt ' + p.step + ', Stil ' + NAMES[stil] + '">' +
      '<button type="button" class="palette" title="Oberfläche wechseln (zu ' + NAMES[other] + ')" aria-label="Oberfläche wechseln zu ' + NAMES[other] + '"></button>';
    if (p.btn) {
      html += '<div class="patch"></div><button type="button" class="pbtn' + (p.disabled ? '"' : ' hot"') +
        (p.disabled ? " disabled" : ' title="Weiter – hier geht’s lang"') + ">" + p.btn + "</button>";
    } else if (p.corner === stil) {
      html += '<div class="patch small"></div>';
    }
    shot.innerHTML = html;
    shot.querySelector(".palette").addEventListener("click", function () { switchStil(other); });
    var hot = shot.querySelector(".pbtn.hot");
    if (hot) hot.addEventListener("click", forward);
    $("stepno").textContent = "Schritt " + p.step + " von 8";
    $("caption").innerHTML = p.text + " <small>· Bild " + (page + 1) + " von " + pages.length + "</small>";
    updateButtons();
  }

  // je Funktion genau ein Knopf: leuchtet der Knopf im Bild, gibt es unten kein „Weiter“
  function updateButtons() {
    var started = page >= 0, last = started && page === pages.length - 1;
    var inImage = started && pages[page].btn && !pages[page].disabled;
    $("prev").hidden = !started;
    $("next").hidden = !started || last || inImage;
    $("restart").hidden = !last;
    $("download").hidden = !last;
  }

  function useStil(s) {
    stil = s;
    root.setAttribute("data-stil", s);
    $("stilinfo").textContent = "Oberfläche: " + NAMES[s] + " · wechseln über das Paletten-Symbol im Plugin";
    pages = PAGES.filter(function (p) { return !p.only || p.only === s; });
    pages.forEach(function (p) { new Image().src = img(p.shot, s); });
  }
  function start(s) { useStil(s); page = 0; tab = 0; render(); }
  function switchStil(s) {
    var here = PAGES.indexOf(pages[page]);
    useStil(s);
    page = 0;
    pages.forEach(function (p, i) { if (PAGES.indexOf(p) <= here) page = i; });
    render();
  }
  function restart() { stil = null; page = -1; tab = 0; render(); }
  function forward() { if (page >= 0 && page < pages.length - 1) { page++; tab = 0; render(); } }
  function back() { if (page > 0) { page--; tab = 0; render(); } else if (page === 0) { restart(); } }

  $("prev").addEventListener("click", back);
  $("next").addEventListener("click", forward);
  $("restart").addEventListener("click", restart);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") forward();
    if (e.key === "ArrowLeft") back();
  });
  render();
})();
</script>
</body>
</html>
