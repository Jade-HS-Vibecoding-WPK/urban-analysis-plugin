<!DOCTYPE html>
<html lang="de" data-stil="klassisch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Analysis – Live-Demo</title>
<meta name="description" content="Live-Demo des QGIS-Plugins Urban Analysis: Schritt für Schritt durchklicken, im Stil Klassisch oder Pixel.">
<style>
  /* Farben wie im Plugin (urban_analysis/theme.py) */
  :root, [data-stil="klassisch"] {
    --accent: #2f6fb0; --accent-dark: #1b4672; --accent-light: #e6f0fa;
    --dock-bg: #f6f7f9; --muted: #5b6470;
  }
  [data-stil="pixel"] {
    --accent: #E8655A; --accent-dark: #B8463D; --accent-light: #F9DDD9;
    --dock-bg: #D3E6DF; --muted: #4F6B66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #e9ebee; color: #1f2328; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button { font: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Kopf- und Fußzeile mit fester Höhe, damit das Plugin-Bild genau passt */
  :root { --head: 48px; --foot: 56px; --dockhead: 26px; }
  .titlebar { height: var(--head); display: flex; align-items: center; gap: 12px; padding: 0 18px; background: #2b2d31; color: #e8e9eb; }
  .titlebar h1 { flex: 1; font-size: 1rem; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titlebar h1 span { font-weight: 400; color: #9aa0a8; }
  .stilinfo { font-size: .82rem; color: #b9bec5; white-space: nowrap; }

  /* PC: links Kartenfenster, rechts das Plugin – so groß, wie die Höhe erlaubt */
  .workspace { height: calc(100vh - var(--head) - var(--foot)); height: calc(100dvh - var(--head) - var(--foot));
               display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .is-intro .workspace { grid-template-columns: 1fr; }
  .is-intro .dock { display: none; }
  .dock { display: flex; flex-direction: column; background: var(--dock-bg); border-left: 1px solid #c4c4c4; min-height: 0; }
  .dockhead { height: var(--dockhead); font-size: .75rem; color: #555; background: #e3e3e3; border-bottom: 1px solid #c4c4c4; padding: 4px 10px; }
  .frame { position: relative; container-type: inline-size; height: calc(100% - var(--dockhead)); aspect-ratio: 820 / 1100; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Klickflächen im Plugin-Bild (Positionen in Prozent des Bildes) */
  .hit { position: absolute; border: 2px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; padding: 0; }
  .hit:hover, .hit:focus-visible { border-color: var(--accent); background: rgba(255,255,255,.25); }
  .hit.glow { border-color: transparent; animation: glow 1.8s ease-in-out infinite; }
  /* Ecke unten rechts: überdeckt die macOS-Vorschau in manchen Screenshots und zeigt den echten Knopf */
  .patch { position: absolute; left: 72%; right: 0; top: 94.2%; bottom: 0; background: var(--dock-bg); }
  .patch.small { left: 82%; top: 96.2%; }
  .pbtn { position: absolute; right: 2.4%; top: 95.1%; height: 3.3%; padding: 0 2.6cqw; white-space: nowrap; cursor: pointer;
          background: #2f6fb0; color: #fff; border: 1px solid #1b4672; border-radius: .9cqw; font: 700 2.55cqw/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          animation: glow 1.8s ease-in-out infinite; }
  [data-stil="pixel"] .pbtn { top: 95.15%; height: 2.85%; background: #E8655A; border: 0; border-radius: 0;
          font: 400 1.6cqw/1 "JetBrains Mono", Menlo, Consolas, "Courier New", monospace; }
  /* größere, unsichtbare Tippfläche für Finger (Handy) – die Optik bleibt gleich */
  .hit::after, .pbtn::after { content: ""; position: absolute; inset: -14px -10px; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px var(--accent-light), 0 0 3px 3px var(--accent); }
                    50% { box-shadow: 0 0 0 3px var(--accent-light), 0 0 14px 7px var(--accent); } }
  @media (prefers-reduced-motion: reduce) { .hit.glow, .pbtn { animation: none; box-shadow: 0 0 0 3px var(--accent); } }

  /* linke Fläche: Hinweiskarte (bis Schritt 7) oder die echte Karte (Schritt 8) */
  .canvas { position: relative; min-width: 0; overflow: hidden; background: #f3f4f6 radial-gradient(#d9dde3 1px, transparent 1px) 0 0 / 22px 22px; }
  .canvas > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .tag { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.94); border: 1px solid #c4c4c4; border-radius: 5px; padding: 3px 9px; font-size: .8rem; color: #333; }
  .maptabs { position: absolute; right: 12px; top: 12px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .maptabs button { border: 1px solid #c4c4c4; background: rgba(255,255,255,.94); border-radius: 5px; padding: 3px 9px; font-size: .8rem; cursor: pointer; }
  .maptabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-dark); color: #fff; }

  .card { background: #fff; border: 1px solid #d5d9df; border-left: 4px solid var(--accent); border-radius: 10px; padding: 20px 24px; box-shadow: 0 6px 24px rgba(0,0,0,.07); }
  .card .kicker { display: block; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .card h3 { margin: 0 0 6px; font-size: 1.2rem; color: var(--accent-dark); }
  .card p { margin: 0 0 14px; }
  .card p:last-child { margin-bottom: 0; }
  .card svg { width: 100%; height: auto; display: block; }
  .card svg text { font: 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #444; }
  .guide .card.wide { width: min(1100px, 100%); }
  .card .preview { width: 100%; max-height: 62vh; object-fit: contain; display: block; border: 1px solid #d5d9df; border-radius: 6px; background: #fff; }
  .guide { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; overflow: auto; }
  .guide .card { width: min(640px, 100%); }
  .note { position: absolute; left: 12px; bottom: 12px; max-width: min(480px, calc(100% - 24px)); padding: 12px 16px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .actions a, .actions button { border: 1px solid #b9b9b9; background: #fafafa; border-radius: 6px; padding: 7px 14px; cursor: pointer; color: #333; text-decoration: none; }
  .actions .go { background: var(--accent); border-color: var(--accent-dark); color: #fff; font-weight: 600; }

  /* Startseite: nur Einleitung und Stilwahl */
  .intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  .intro .card { max-width: 600px; border-left-width: 1px; }
  .intro h2 { font-size: 2rem; margin: 0 0 8px; }
  .choice { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 16px 0 12px; }
  .choice button { width: 220px; border: 2px solid #c4c4c4; border-radius: 10px; background: #fff; padding: 16px 12px; cursor: pointer; color: #333; }
  .choice button:hover { border-color: #2f6fb0; }
  .choice b { display: block; font-size: 1.1rem; margin-bottom: 4px; }
  .choice span { display: block; font-size: .85rem; color: #666; }
  .choice .k b { color: #1b4672; } .choice .p b { color: #B8463D; font-family: Menlo, Consolas, monospace; }
  .intro .hint { color: #555; font-size: .92rem; }
  .intro .ask { margin: 18px 0 0; font-size: 1.3rem; font-weight: 700; color: #1b4672; }  .intro small { display: block; color: #777; margin-top: 14px; line-height: 1.5; }
  .intro a { color: #1b4672; }

  /* Fußzeile: nur die Erklärung – bedient wird alles im Plugin */
  .status { height: var(--foot); display: flex; align-items: center; gap: 14px; padding: 0 18px; background: #fff; border-top: 1px solid #c4c4c4; }
  .status .step { font-weight: 700; white-space: nowrap; color: var(--accent-dark); }
  .status p { margin: 0; flex: 1; min-width: 0; font-size: .95rem; }
  .status p small { color: #888; white-space: nowrap; }

  /* Handy: Plugin oben (passt auf den Bildschirm), Hinweis darunter */
  @media (max-width: 900px) {
    :root { --foot: auto; }
    .titlebar { padding: 0 12px; } .titlebar h1 span, .stilinfo { display: none; }
    .workspace { height: auto; display: flex; flex-direction: column; }
    .dock { order: 1; border-left: 0; align-items: center; padding: 10px 0; }
    .dockhead { display: none; }
    .frame { height: auto; width: min(calc(100vw - 24px), calc((100dvh - var(--head) - 110px) * 820 / 1100)); }
    .canvas { order: 2; min-height: 340px; border-top: 1px solid #c4c4c4; }
    .guide, .intro { position: relative; inset: auto; padding: 14px; }
    .card { padding: 14px 16px; }
    .canvas > img { position: relative; height: 340px; }
    .note { position: relative; left: auto; bottom: auto; max-width: none; margin: 12px; }
    .status { position: sticky; bottom: 0; height: auto; flex-wrap: wrap; gap: 2px 10px; padding: 10px 12px; }
    .status p { flex-basis: 100%; font-size: .88rem; }
  }
</style>
</head>

    { step: 8, shot: "08-ausgabe", corner: "pixel", hit: "erzeugen", hitLabel: "Layer erzeugen",
      card: ["Gleich erscheint die Karte", "Mit „Layer erzeugen“ legt das Plugin die Ergebnis-Layer als neue Gruppe in QGIS an – erst jetzt kommt alles in die Karte.", "erzeugen"],
      text: "Ausgabe: Kartenstil wählen und die Ergebnis-Layer erzeugen." },
    { step: 8, shot: "08-erreichbarkeit", corner: "klassisch", hit: "tabSpeichern", hitLabel: "Speichern",
      map: { bild: "09-erreichbarkeit", label: "Erreichbarkeit – Ringe 300 / 500 m" }, note: "<b>Optional: Erreichbarkeit abschätzen.</b> Die Ergebnis-Layer sind fertig – wer mag, berechnet zusätzlich Abstände: zu Zielen aus den Daten (z. B. Gesundheit, Nahversorgung, Bildung) oder zu eigenen Punkten. Ergebnis: Ringe um die Ziele und der Abstand jedes Gebäudes (Luftlinie).",
      text: "Erreichbarkeit (optional): Abstände zu Zielen aus den Daten oder zu eigenen Punkten abschätzen." },
    { step: 8, shot: "08-speichern", corner: "pixel", btn: "Speichern",
      map: { tabs: [["Schwarzplan", "09-karte-schwarzplan"], ["Nutzungskarte", "09-karte-nutzung"]], label: "Karte für das PDF" }, note: "Das PDF zeigt die sichtbaren Layer – mit Legende, Nordpfeil, Maßstab und Quellen. Oben rechts den Kartenstil umschalten.",
      text: "Speichern: PDF von A4 bis A0 mit passendem Maßstab, dazu ein GeoPackage mit allen Ergebnis-Layern." },
    { step: 8, shot: "08-fertig", last: true,
      map: { tabs: [["Nutzungskarte", "09-karte-nutzung"], ["Schwarzplan", "09-karte-schwarzplan"], ["Erreichbarkeit", "09-erreichbarkeit"], ["Tabelle", "09-tabelle"], ["Ebenen", "09-layer"]], label: "Ergebnis" },
      note: "Fertig – alles gespeichert. Oben rechts die Ergebnisse ansehen.",
      text: "Fertig! Die Quellenvermerke stehen automatisch in Tabelle und PDF." }
  ];
  var NAMES = { klassisch: "Klassisch", pixel: "Pixel" };
  var root = document.documentElement, body = document.body, canvas = document.getElementById("canvas"), shot = document.getElementById("shot");
  // Der Stil wird am Anfang gewählt und bleibt gleich – wechseln nur über das Paletten-Symbol im Plugin.
  var stil = null, page = -1, tab = 0, pages = [];

  function img(name, s) { return "bilder/" + name + (s ? "-" + s : "") + ".jpg"; }
  function $(id) { return document.getElementById(id); }
  function shotOf(p) { return (p.alt && p.alt[stil]) || p.shot; }
  function hitStyle(r) {
    return 'left:' + (r[0] / 8.2) + '%;top:' + (r[1] / 11) + '%;width:' + ((r[2] - r[0]) / 8.2) + '%;height:' + ((r[3] - r[1]) / 11) + '%';
  }

  function renderIntro() {
    body.classList.add("is-intro");
    root.setAttribute("data-stil", "klassisch");
    $("stilinfo").textContent = "";
    shot.innerHTML = "";
    canvas.innerHTML = '<div class="intro"><div class="card"><h2>Urban Analysis</h2>' +
      "<p>Ein QGIS-Plugin, das von der leeren Karte zu einer sauberen Bestandsanalyse führt – Schritt für Schritt.</p>" +
      '<p class="ask">Wähle zuerst die Oberfläche:</p>' +
      '<div class="choice"><button type="button" class="k" data-start="klassisch"><b>Klassisch</b><span>hell und neutral wie QGIS</span></button>' +
      '<button type="button" class="p" data-start="pixel"><b>Pixel</b><span>verspielt, mit Hase und Fisch</span></button></div>' +
      '<p class="hint">Danach führt dich der leuchtende Knopf im Plugin durch alle 8 Schritte.<br>🎨 Die Oberfläche lässt sich jederzeit im Plugin über das Paletten-Symbol oben rechts wechseln.</p>' +
      '<small>Daten: © OpenStreetMap-Mitwirkende, ODbL · © GeoBasis-DE/LGLN 2026, CC BY 4.0 · Plugin: Apache 2.0 · ' +
      'Mit KI-Programmierassistenten entwickelt, vom Team geprüft · <a href="' + REPO + '">Quellcode auf GitHub</a></small></div></div>';
    canvas.querySelectorAll("[data-start]").forEach(function (b) {
      b.addEventListener("click", function () { start(b.getAttribute("data-start")); });
    });
    $("stepno").textContent = "Start";
    $("caption").textContent = "Eine Demo in Screenshots aus QGIS – Donnerschwee, Oldenburg.";
  }

  function cardHtml(c, kicker) {
    var art = typeof c[2] === "string" ? SVG[c[2]] : '<img class="preview" src="' + img(c[2].img) + '" alt="' + c[2].alt + '">';
    return '<div class="card' + (typeof c[2] === "string" ? "" : " wide") + '"><span class="kicker">' + kicker + "</span><h3>" + c[0] + "</h3><p>" + c[1] + "</p>" + art + "</div>";
  }

  function renderCanvas(p) {
    if (p.card) {
      canvas.innerHTML = '<div class="guide">' + cardHtml(p.card, "Im Kartenfenster") + "</div>";
      return;
    }
    var c = p.map, html;
    if (c.tabs) {
      var t = c.tabs[Math.min(tab, c.tabs.length - 1)];
      html = '<img src="' + img(t[1]) + '" alt="' + t[0] + '"><span class="tag">' + c.label + '</span><div class="maptabs" role="group" aria-label="Ansicht im Kartenfenster">';
      c.tabs.forEach(function (x, i) { html += '<button type="button" data-tab="' + i + '" aria-pressed="' + (x === t) + '">' + x[0] + "</button>"; });
      html += "</div>";
    } else {
      html = '<img src="' + img(c.bild) + '" alt="' + c.label + '"><span class="tag">' + c.label + "</span>";
    }
    html += '<div class="card note"><span class="kicker">Im Kartenfenster</span>' + p.note +
      (p.last ? '<div class="actions"><a class="go" href="' + DOWNLOAD + '">Plugin herunterladen</a><button type="button" id="restart">Demo neu starten</button></div>' : "") + "</div>";
    canvas.innerHTML = html;
    canvas.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { tab = +b.getAttribute("data-tab"); renderCanvas(p); });
    });
    var r = $("restart");
    if (r) r.addEventListener("click", restart);
  }

  function render() {
    if (page < 0) { renderIntro(); return; }
    body.classList.remove("is-intro");
    var p = pages[page], other = stil === "pixel" ? "klassisch" : "pixel";
    renderCanvas(p);
    // Alles wird im Plugin bedient: Zurück, Weiter (leuchtet), Paletten-Symbol
    var html = '<img src="' + img(shotOf(p), stil) + '" alt="Plugin, Schritt ' + p.step + ', Stil ' + NAMES[stil] + '">' +
      '<button type="button" class="hit" data-do="palette" style="left:85.6%;top:.2%;width:4.4%;height:3%" title="Oberfläche wechseln (zu ' + NAMES[other] + ')" aria-label="Oberfläche wechseln zu ' + NAMES[other] + '"></button>' +
      '<button type="button" class="hit" data-do="back" style="' + hitStyle(BACK) + '" title="Zurück" aria-label="Zurück"></button>';
    if (p.btn) {
      html += '<div class="patch"></div><button type="button" class="pbtn" data-do="next" title="Weiter – hier geht’s lang">' + p.btn + "</button>";
    } else {
      if (p.corner === stil) html += '<div class="patch small"></div>';
      if (p.hit) html += '<button type="button" class="hit glow" data-do="next" style="' + hitStyle(HIT[p.hit][stil]) + '" title="' + p.hitLabel + ' – hier geht’s lang" aria-label="' + p.hitLabel + '"></button>';
    }
    shot.innerHTML = html;
    shot.querySelectorAll("[data-do]").forEach(function (b) {
      var what = b.getAttribute("data-do");
      b.addEventListener("click", what === "next" ? forward : what === "back" ? back : function () { switchStil(other); });
    });
    $("stepno").textContent = "Schritt " + p.step + " von 8";
    $("caption").innerHTML = p.text + " <small>· Bild " + (page + 1) + " von " + pages.length + "</small>";
  }

  function useStil(s) {
    stil = s;
    root.setAttribute("data-stil", s);
    $("stilinfo").textContent = "Oberfläche: " + NAMES[s] + " · wechseln über das Paletten-Symbol im Plugin";
    // alle Seiten in beiden Stilen – fehlt ein Screenshot, nimmt die Seite ein passendes Ersatzbild (alt)
    pages = PAGES;
    pages.forEach(function (p) { new Image().src = img(shotOf(p), s); });
  }
  function start(s) { useStil(s); page = 0; tab = 0; render(); }
  // Paletten-Symbol: nur der Stil wechselt, die Seite bleibt dieselbe
  function switchStil(s) { useStil(s); render(); }
  function restart() { stil = null; page = -1; tab = 0; render(); }
  function forward() { if (page >= 0 && page < pages.length - 1) { page++; tab = 0; render(); } }
  function back() { if (page > 0) { page--; tab = 0; render(); } else if (page === 0) { restart(); } }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") forward();
    if (e.key === "ArrowLeft") back();
  });
  render();
})();
</script>
</body>
</html>
